<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>完整流程測試</title>
</head>
<body>
    <h1>完整流程測試</h1>

    <h3>1. 建立新維修單</h3>
    <button onclick="createTicket()">建立測試單</button>
    <pre id="r1"></pre>

    <h3>2. 認領</h3>
    <p>單據 id: <input type="number" id="ticketId2" value=""></p>
    <button onclick="claim()">認領(技術員 id=3)</button>
    <pre id="r2"></pre>

    <h3>3. 退回</h3>
    <p>單據 id: <input type="number" id="ticketId3" value=""></p>
    <button onclick="returnTicket()">退回(技術員 id=3)</button>
    <pre id="r3"></pre>

    <h3>4. 修改重新提交</h3>
    <p>單據 id: <input type="number" id="ticketId4" value=""></p>
    <button onclick="resubmit()">重新提交(申請人 id=1)</button>
    <pre id="r4"></pre>

    <script>
        function createTicket() {
            fetch('http://localhost:8080/api/tickets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ equipmentId: 1, applicantId: 1, description: '完整流程測試單', severity: 'LOW' })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('r1').textContent = JSON.stringify(data);
                    document.getElementById('ticketId2').value = data.id;
                    document.getElementById('ticketId3').value = data.id;
                    document.getElementById('ticketId4').value = data.id;
                });
        }

        function claim() {
            const id = document.getElementById('ticketId2').value;
            fetch('http://localhost:8080/api/tickets/' + id + '/claim', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actorId: 3 })
            })
                .then(res => res.text().then(t => ({ status: res.status, body: t })))
                .then(({ status, body }) => document.getElementById('r2').textContent = status + '\n' + body);
        }

        function returnTicket() {
            const id = document.getElementById('ticketId3').value;
            fetch('http://localhost:8080/api/tickets/' + id + '/resolve', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actorId: 3, action: 'RETURN', comment: '需要更詳細的異常描述' })
            })
                .then(res => res.text().then(t => ({ status: res.status, body: t })))
                .then(({ status, body }) => document.getElementById('r3').textContent = status + '\n' + body);
        }

        function resubmit() {
            const id = document.getElementById('ticketId4').value;
            fetch('http://localhost:8080/api/tickets/' + id + '/resubmit', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actorId: 1, description: '音響完全沒有聲音,已確認插頭和音量都正常,懷疑是內部線路問題', severity: 'MEDIUM' })
            })
                .then(res => res.text().then(t => ({ status: res.status, body: t })))
                .then(({ status, body }) => document.getElementById('r4').textContent = status + '\n' + body);
        }
    </script>
</body>
</html>
