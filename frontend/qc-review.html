<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>品管審核 - 設備維修簽核系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }
        .header {
            background-color: #4a90d9;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f0f0f0;
        }
        button {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
        .btn-review {
            background-color: #4a90d9;
        }
        .empty {
            color: #999;
            padding: 16px 0;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 400px;
        }
        select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            margin: 8px 0;
        }
        textarea {
            height: 70px;
        }
        .error {
            color: red;
            margin-top: 8px;
        }
        .btn-submit {
            background-color: #4a90d9;
        }
        .btn-cancel {
            background-color: #ccc;
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div>設備維修簽核系統 — 品管審核</div>
            <div>
                {{ currentUser ? currentUser.fullName : '' }}
                <button @click="logout" style="margin-left:12px; background-color:#d9534f; padding:4px 10px;">登出</button>
            </div>
        </div>

        <div class="container">
            <h2>待審核清單(本部門)</h2>
            <table>
                <thead>
                    <tr>
                        <th>單號</th>
                        <th>設備 ID</th>
                        <th>描述</th>
                        <th>嚴重程度</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="ticket in pendingTickets" :key="ticket.id">
                        <td>{{ ticket.id }}</td>
                        <td>{{ ticket.equipmentId }}</td>
                        <td>{{ ticket.description }}</td>
                        <td>{{ ticket.severity }}</td>
                        <td><button class="btn-review" @click="openReview(ticket)">審核</button></td>
                    </tr>
                </tbody>
            </table>
            <p class="empty" v-if="pendingTickets.length === 0">目前沒有待審核的單據</p>
        </div>

        <div class="modal-overlay" v-if="reviewTarget">
            <div class="modal-box">
                <h3>品管審核</h3>
                <p>單據 #{{ reviewTarget.id }}: {{ reviewTarget.description }}</p>

                <label>維修結果</label>
                <select v-model="repairResult">
                    <option value="REPAIRED">已維修</option>
                    <option value="SCRAP_RECOMMENDED">建議報廢</option>
                </select>

                <textarea v-model="reviewComment" placeholder="審核說明(選填)"></textarea>

                <div>
                    <button class="btn-submit" @click="submitReview">送出審核</button>
                    <button class="btn-cancel" @click="closeReview">取消</button>
                </div>
                <div class="error" v-if="errorMessage">{{ errorMessage }}</div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    currentUser: null,
                    token: null,
                    pendingTickets: [],
                    reviewTarget: null,
                    repairResult: 'REPAIRED',
                    reviewComment: '',
                    errorMessage: ''
                };
            },
            async mounted() {
                const stored = localStorage.getItem('currentUser');
                const token = localStorage.getItem('token');
                if (!stored || !token) {
                    window.location.href = 'login.html';
                    return;
                }
                this.currentUser = JSON.parse(stored);
                this.token = token;
                await this.loadData();
            },
            methods: {
                async loadData() {
                    const response = await fetch(
                        'http://localhost:8080/api/tickets?status=PENDING_QC&departmentId=' + this.currentUser.departmentId,
                        { headers: { 'Authorization': this.token } }
                    );
                    this.pendingTickets = await response.json();
                },
                openReview(ticket) {
                    this.reviewTarget = ticket;
                    this.repairResult = 'REPAIRED';
                    this.reviewComment = '';
                    this.errorMessage = '';
                },
                closeReview() {
                    this.reviewTarget = null;
                },
                async submitReview() {
                    const response = await fetch(
                        'http://localhost:8080/api/tickets/' + this.reviewTarget.id + '/qc-review',
                        {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': this.token
                            },
                            body: JSON.stringify({
                                repairResult: this.repairResult,
                                comment: this.reviewComment
                            })
                        }
                    );
                    if (!response.ok) {
                        this.errorMessage = await response.text();
                        return;
                    }
                    this.reviewTarget = null;
                    await this.loadData();
                },
                logout() {
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            }
        }).mount('#app');
    </script>

</body>
</html>
