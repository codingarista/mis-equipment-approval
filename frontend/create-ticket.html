<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>建立維修單 - 設備維修簽核系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }
        .header {
            background-color: #4a90d9;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .container {
            max-width: 500px;
            margin: 24px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .buttons {
            margin-top: 24px;
            display: flex;
            gap: 8px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit {
            background-color: #4a90d9;
            color: white;
        }
        .btn-cancel {
            background-color: #ccc;
        }
        .error {
            color: red;
            margin-top: 12px;
        }
        .bell-btn {
            background-color: rgba(255,255,255,0.2);
            position: relative;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #d9534f;
            color: white;
            border-radius: 10px;
            font-size: 11px;
            padding: 1px 6px;
        }
        .notif-panel {
            position: absolute;
            top: 44px;
            right: 0;
            width: 320px;
            background: white;
            color: #333;
            border-radius: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
        }
        .notif-item {
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 13px;
        }
        .notif-item:hover {
            background-color: #f5f5f5;
        }
        .notif-item.unread {
            font-weight: bold;
            background-color: #eef5ff;
        }
        .notif-empty {
            padding: 16px;
            color: #999;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div>設備維修簽核系統 — 建立維修單</div>
            <div class="header-right">
                <button class="bell-btn" @click="toggleNotifications">
                    🔔
                    <span class="badge" v-if="unreadCount > 0">{{ unreadCount }}</span>
                </button>

                <div class="notif-panel" v-if="showNotifications">
                    <div class="notif-item" :class="{ unread: !n.isRead }" v-for="n in notifications" :key="n.id" @click="openNotification(n)">
                        單據 #{{ n.ticketId }} 有更新 · {{ formatDate(n.createdAt) }}
                    </div>
                    <div class="notif-empty" v-if="notifications.length === 0">目前沒有通知</div>
                </div>
            </div>
        </div>

        <div class="container">
            <label>設備</label>
            <select v-model="form.equipmentId">
                <option value="">請選擇設備</option>
                <option v-for="eq in equipmentList" :key="eq.id" :value="eq.id">
                    {{ eq.equipment_no }} - {{ eq.name }}
                </option>
            </select>

            <label>異常描述</label>
            <textarea v-model="form.description" placeholder="請描述設備異常狀況"></textarea>

            <label>嚴重程度</label>
            <select v-model="form.severity">
                <option value="LOW">輕微</option>
                <option value="MEDIUM">中等</option>
                <option value="HIGH">嚴重</option>
            </select>

            <div class="buttons">
                <button class="btn-submit" @click="submit">送出</button>
                <button class="btn-cancel" @click="cancel">取消</button>
            </div>

            <div class="error" v-if="errorMessage">{{ errorMessage }}</div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    currentUser: null,
                    token: null,
                    equipmentList: [],
                    notifications: [],
                    unreadCount: 0,
                    showNotifications: false,
                    form: {
                        equipmentId: '',
                        description: '',
                        severity: 'LOW'
                    },
                    errorMessage: ''
                };
            },
            async mounted() {
                const stored = localStorage.getItem('currentUser');
                const token = localStorage.getItem('token');
                if (!stored || !token) {
                    window.location.href = 'login.html';
                    return;
                }
                this.currentUser = JSON.parse(stored);
                this.token = token;

                const response = await fetch('http://localhost:8080/api/equipment', {
                    headers: { 'Authorization': this.token }
                });
                this.equipmentList = await response.json();
                await this.loadUnreadCount();
            },
            methods: {
                async loadUnreadCount() {
                    const response = await fetch('http://localhost:8080/api/notifications/unread-count', {
                        headers: { 'Authorization': this.token }
                    });
                    const data = await response.json();
                    this.unreadCount = data.unreadCount;
                },
                async loadNotifications() {
                    const response = await fetch('http://localhost:8080/api/notifications', {
                        headers: { 'Authorization': this.token }
                    });
                    this.notifications = await response.json();
                },
                async toggleNotifications() {
                    this.showNotifications = !this.showNotifications;
                    if (this.showNotifications) {
                        await this.loadNotifications();
                    }
                },
                async openNotification(notification) {
                    if (!notification.isRead) {
                        await fetch('http://localhost:8080/api/notifications/' + notification.id + '/read', {
                            method: 'PATCH',
                            headers: { 'Authorization': this.token }
                        });
                    }
                    window.location.href = 'detail.html?id=' + notification.ticketId;
                },
                formatDate(dateStr) {
                    if (!dateStr) return '';
                    return dateStr.replace('T', ' ').substring(0, 16);
                },
                async submit() {
                    this.errorMessage = '';

                    if (!this.form.equipmentId || !this.form.description) {
                        this.errorMessage = '請選擇設備並填寫異常描述';
                        return;
                    }

                    const response = await fetch('http://localhost:8080/api/tickets', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': this.token
                        },
                        body: JSON.stringify({
                            equipmentId: parseInt(this.form.equipmentId),
                            description: this.form.description,
                            severity: this.form.severity
                        })
                    });

                    if (!response.ok) {
                        this.errorMessage = await response.text();
                        return;
                    }

                    window.location.href = 'my-tickets.html';
                },
                cancel() {
                    window.location.href = 'my-tickets.html';
                }
            }
        }).mount('#app');
    </script>

</body>
</html>
